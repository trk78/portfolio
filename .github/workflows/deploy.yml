# Compile et déploie sur Cloudflare Pages (projet « timeo », envoi direct via Wrangler) à chaque push sur main.
# Secret requis : CLOUDFLARE_API_TOKEN (droit « Cloudflare Pages : Edit »). Variable : CLOUDFLARE_ACCOUNT_ID.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Jeton Cloudflare présent ?
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Secret CLOUDFLARE_API_TOKEN absent : déploiement ignoré."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - if: steps.gate.outputs.skip != 'true'
        run: npm run build
      - name: Envoi sur Cloudflare Pages
        if: steps.gate.outputs.skip != 'true'
        run: npx --yes wrangler@4 pages deploy dist --project-name=timeo --branch=main --commit-hash=${{ github.sha }}
